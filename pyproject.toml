[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lxmc2alcfg"
version = "0.1.0"
description = "Convert lx-music backup (.lxmc) playlists into any-listen songlist backup (.alcfg)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lxmc2alcfg contributors" }]
keywords = ["lx-music", "any-listen", "playlist", "converter", "music", "alcfg", "lxmc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
lxmc2alcfg = "lxmc2alcfg.cli:main"

[project.urls]
Homepage = "https://github.com/cute-aaa/lx2al"
Issues = "https://github.com/cute-aaa/lx2al/issues"

[tool.setuptools.packages.find]
include = ["lxmc2alcfg*"]
